[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recostack"
version = "0.1.0"
description = "A fully local, open-source, production-style recommendation system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Harish Siva Subramanian"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
# Core ML stack: matrix factorization, embeddings, LightGBM
ml = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
]

# Feature store
feast = [
    "feast>=0.38.0",
]

# Experiment tracking & model registry
mlflow = [
    "mlflow>=2.10.0",
]

# Streaming (Kafka/Redpanda)
streaming = [
    "kafka-python>=2.0.2",
]

# Serving API
serving = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
]

# Low-latency cache / online store
cache = [
    "redis>=5.0.0",
]

# Monitoring
monitoring = [
    "prometheus-client>=0.19.0",
]

# All-in-one install (what you'd use for dev/prod deployment)
all = [
    "recostack[ml,feast,mlflow,streaming,serving,cache,monitoring]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "recostack[all]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "feast*", "recommenders*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]