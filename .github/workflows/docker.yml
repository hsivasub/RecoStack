# RecoStack — Docker Image Build
#
# Builds and optionally pushes the FastAPI serving image to GitHub Container
# Registry on pushes to main. Also runs a quick smoke test to verify the
# image starts and responds to /health.

name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "docker/Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — start container
        if: github.event_name == 'push'
        run: |
          docker run -d --name recostack-smoke \
            -p 8000:8000 \
            ${{ steps.meta.outputs.tags }}

      - name: Smoke test — wait for startup
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke test — verify /health
        if: github.event_name == 'push'
        run: |
          HEALTH=$(curl -s http://localhost:8000/health)
          echo "$HEALTH" | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'; print('Health OK')"

      - name: Smoke test — verify /metrics
        if: github.event_name == 'push'
        run: |
          curl -s http://localhost:8000/metrics | grep -q "recostack_" && echo "Metrics OK"

      - name: Cleanup
        if: always()
        run: docker rm -f recostack-smoke 2>/dev/null || true